worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Long legacy-redirect keys need a bigger map hash bucket.
    map_hash_bucket_size 128;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    types {
        application/manifest+json  webmanifest;
        text/vtt                   vtt;
    }

    # Request logs come from Cloud Run, so nginx access_log is left off.
    access_log off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Keep directory redirects relative so Cloud Run is not rewritten to :8080.
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    client_body_temp_path /tmp/nginx-cache/client_body;
    proxy_temp_path       /tmp/nginx-cache/proxy;
    fastcgi_temp_path     /tmp/nginx-cache/fastcgi;
    uwsgi_temp_path       /tmp/nginx-cache/uwsgi;
    scgi_temp_path        /tmp/nginx-cache/scgi;

    # Unhashed assets can still be revalidated via ETag. HTML stays short.
    map $sent_http_content_type $cache_control {
        default                     "public, max-age=60, must-revalidate";
        ~text/html                  "public, max-age=60, must-revalidate";
        ~text/plain                 "public, max-age=60, must-revalidate";
        ~text/xml                   "public, max-age=60, must-revalidate";
        ~application/xml            "public, max-age=60, must-revalidate";
        ~application/manifest\+json "public, max-age=300, must-revalidate";
        ~text/css                   "public, max-age=31536000";
        ~text/javascript            "public, max-age=31536000";
        ~application/javascript     "public, max-age=31536000";
        ~image/                     "public, max-age=31536000";
        ~video/                     "public, max-age=31536000";
        ~font/                      "public, max-age=31536000";
        ~application/font           "public, max-age=31536000";
        ~application/vnd.ms-fontobject "public, max-age=31536000";
    }


    # Old ChatGPT-site paths and retired marketing URLs. Fragments are quoted
    # because # starts a comment in nginx config.
    map $uri $ivo_legacy_redirect {
        default "";

        /contact                                              "/#request";
        /contact/                                             "/#request";
        /contact.html                                         "/#request";
        /p_contact.html                                       "/#request";
        /p_contact_urgent_1_service_Emergency_20property_20response.html "/emergency-property-response/";
        /start-request                                        "/#request";
        /start-request/                                       "/#request";
        /start-request.html                                   "/#request";
        /p_start-request.html                                 "/#request";
        /request-bid                                          "/#request";
        /request-bid/                                         "/#request";
        /request-bid.html                                     "/#request";
        /p_request-bid.html                                   "/#request";

        /contractor-vendor-application                        "/partner-with-ivo/#apply";
        /contractor-vendor-application/                       "/partner-with-ivo/#apply";
        /contractor-vendor-application.html                   "/partner-with-ivo/#apply";
        /p_contractor-vendor-application.html                 "/partner-with-ivo/#apply";
        /p_contractor-vendor-application_party_vendor.html    "/partner-with-ivo/#apply";

        /capabilities                                         "/#services";
        /capabilities/                                        "/#services";
        /capabilities.html                                    "/#services";
        /p_capabilities.html                                  "/#services";

        # /privacy/ is a live page now; only the old file names redirect to it.
        /privacy.html                                         "/privacy/";
        /p_privacy.html                                       "/privacy/";
        /terms                                                "/";
        /terms/                                               "/";
        /terms.html                                           "/";
        /p_terms.html                                         "/";

        /p_home.html                                          "/";
        /p_about-ivo.html                                     "/about-ivo/";
        /p_commercial-construction.html                       "/commercial-construction/";
        /p_property-services.html                             "/property-services/";
        /p_emergency-property-response.html                   "/emergency-property-response/";
        /p_specialty-services.html                            "/specialty-services/";
        /p_our-work.html                                      "/our-work/";
        /p_how-to-work-with-ivo.html                          "/how-to-work-with-ivo/";
        /p_partner-with-ivo.html                              "/partner-with-ivo/";
        /p_portal.html                                        "/portal/";
        /p_portal-walkthrough.html                            "/our-apps/#walkthrough";
        /p_industries.html                                    "/about-ivo/#who-we-work-with";

        /account                                              "/portal/";
        /account/                                             "/portal/";
        /account.html                                         "/portal/";
        /p_account.html                                       "/portal/";
        /account/sign-in                                      "/portal/";
        /account/sign-in/                                     "/portal/";
        /p_account_sign-in.html                               "/portal/";
        /admin                                                "/portal/";
        /admin/                                               "/portal/";
        /admin.html                                           "/portal/";
        /p_admin.html                                         "/portal/";
        /admin/control                                        "/portal/";
        /admin/control/                                       "/portal/";
        /p_admin_control.html                                 "/portal/";
        /network                                              "/portal/";
        /network/                                             "/portal/";
        /network.html                                         "/portal/";
        /p_network.html                                       "/portal/";
        /pricing                                              "/portal/";
        /pricing/                                             "/portal/";
        /pricing.html                                         "/portal/";
        /p_pricing.html                                       "/portal/";
        /projects                                             "/portal/";
        /projects/                                            "/portal/";
        /projects.html                                        "/portal/";
        /p_projects.html                                      "/portal/";
        /team-access                                          "/portal/";
        /team-access/                                         "/portal/";
        /team-access.html                                     "/portal/";
        /p_team-access.html                                   "/portal/";
        /signin-with-chatgpt                                  "/portal/";
        /signin-with-chatgpt/                                 "/portal/";
        /p_signin-with-chatgpt.html                           "/portal/";
        /portal/contractor                                    "/portal/";
        /portal/contractor/                                   "/portal/";
        /p_portal_contractor.html                             "/portal/";
        /portal/customer                                      "/portal/";
        /portal/customer/                                     "/portal/";
        /p_portal_customer.html                               "/portal/";
        /portal/vendor                                        "/portal/";
        /portal/vendor/                                       "/portal/";
        /p_portal_vendor.html                                 "/portal/";
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        if ($ivo_legacy_redirect != "") {
            return 301 $ivo_legacy_redirect;
        }


        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control $cache_control always;

        # Legacy paths from the longer page set. Fragments are quoted
        # because # starts a comment in nginx config.
        # The IVO apps (customer, technician and staff) run on their own Cloud Run service. Short links from the site.
        # The IVO apps are served at app.ivoservgroup.com. Keep this address in sync with portal/index.html and unsubscribe/index.html.
        location = /app {
            return 302 "https://app.ivoservgroup.com/app/signin";
        }
        location = /app/ {
            return 302 "https://app.ivoservgroup.com/app/signin";
        }
        location = /signin {
            return 302 "https://app.ivoservgroup.com/app/signin";
        }

        location = /portal-walkthrough {
            return 301 "/our-apps/#walkthrough";
        }
        location = /portal-walkthrough/ {
            return 301 "/our-apps/#walkthrough";
        }
        location = /portal-walkthrough/index.html {
            return 301 "/our-apps/#walkthrough";
        }

        location = /faq {
            return 301 "/how-to-work-with-ivo/#faq";
        }
        location = /faq/ {
            return 301 "/how-to-work-with-ivo/#faq";
        }
        location = /faq/index.html {
            return 301 "/how-to-work-with-ivo/#faq";
        }

        # State pages live under /locations/<state>/; the folder itself goes to the full service area.
        location = /locations {
            return 301 "/about-ivo/#service-area";
        }
        location = /locations/ {
            return 301 "/about-ivo/#service-area";
        }
        location = /service-area {
            return 301 "/about-ivo/#service-area";
        }
        location = /service-area/ {
            return 301 "/about-ivo/#service-area";
        }
        location = /service-area/index.html {
            return 301 "/about-ivo/#service-area";
        }

        location = /industries {
            return 301 "/about-ivo/#who-we-work-with";
        }
        location = /industries/ {
            return 301 "/about-ivo/#who-we-work-with";
        }
        location = /industries/index.html {
            return 301 "/about-ivo/#who-we-work-with";
        }


        # Older archived /v3/ tree. Keep it off search indexes.
        location ^~ /v3/ {
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control $cache_control always;
            try_files $uri $uri/ =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=60, must-revalidate" always;
        }
    }
}
