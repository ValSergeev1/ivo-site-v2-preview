worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    types {
        application/manifest+json  webmanifest;
        text/vtt                   vtt;
    }

    # Request logs come from Cloud Run, so nginx access_log is left off.
    access_log off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Keep directory redirects relative so Cloud Run is not rewritten to :8080.
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    client_body_temp_path /tmp/nginx-cache/client_body;
    proxy_temp_path       /tmp/nginx-cache/proxy;
    fastcgi_temp_path     /tmp/nginx-cache/fastcgi;
    uwsgi_temp_path       /tmp/nginx-cache/uwsgi;
    scgi_temp_path        /tmp/nginx-cache/scgi;

    # Unhashed assets can still be revalidated via ETag. HTML stays short.
    map $sent_http_content_type $cache_control {
        default                     "public, max-age=60, must-revalidate";
        ~text/html                  "public, max-age=60, must-revalidate";
        ~text/plain                 "public, max-age=60, must-revalidate";
        ~text/xml                   "public, max-age=60, must-revalidate";
        ~application/xml            "public, max-age=60, must-revalidate";
        ~application/manifest\+json "public, max-age=300, must-revalidate";
        ~text/css                   "public, max-age=31536000";
        ~text/javascript            "public, max-age=31536000";
        ~application/javascript     "public, max-age=31536000";
        ~image/                     "public, max-age=31536000";
        ~video/                     "public, max-age=31536000";
        ~font/                      "public, max-age=31536000";
        ~application/font           "public, max-age=31536000";
        ~application/vnd.ms-fontobject "public, max-age=31536000";
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control $cache_control always;

        # Legacy paths from the longer page set. Fragments are quoted
        # because # starts a comment in nginx config.
        location = /portal-walkthrough {
            return 301 "/our-apps/#walkthrough";
        }
        location = /portal-walkthrough/ {
            return 301 "/our-apps/#walkthrough";
        }
        location = /portal-walkthrough/index.html {
            return 301 "/our-apps/#walkthrough";
        }

        location = /faq {
            return 301 "/how-to-work-with-ivo/#faq";
        }
        location = /faq/ {
            return 301 "/how-to-work-with-ivo/#faq";
        }
        location = /faq/index.html {
            return 301 "/how-to-work-with-ivo/#faq";
        }

        location = /service-area {
            return 301 "/about-ivo/#service-area";
        }
        location = /service-area/ {
            return 301 "/about-ivo/#service-area";
        }
        location = /service-area/index.html {
            return 301 "/about-ivo/#service-area";
        }

        location = /industries {
            return 301 "/about-ivo/#who-we-work-with";
        }
        location = /industries/ {
            return 301 "/about-ivo/#who-we-work-with";
        }
        location = /industries/index.html {
            return 301 "/about-ivo/#who-we-work-with";
        }


        # Older archived /v3/ tree. Keep it off search indexes.
        location ^~ /v3/ {
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control $cache_control always;
            try_files $uri $uri/ =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=60, must-revalidate" always;
        }
    }
}
